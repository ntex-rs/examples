[package]
name = "template_yarte"
version = "4.0.0"
description = "Render minified HTML with ntex and compile-time Yarte templates"
authors = ["Juan Aguilar Santillana <mhpoin@gmail.com>"]
publish = false
edition = "2024"

[dependencies]
env_logger = { workspace = true }
yarte = { workspace = true }
ntex = { workspace = true }

[build-dependencies.yarte_helpers]
version = "0.15"
default-features = false
features = ["config"]
