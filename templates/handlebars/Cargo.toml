[package]
name = "template_handlebars"
version = "4.0.0"
description = "Share a Handlebars template registry across ntex workers"
authors = ["Alexandru Tiniuc <tiniuc.alexandru@gmail.com>"]
edition = "2024"

[dependencies]
ntex = { workspace = true }
handlebars = { workspace = true, features = ["dir_source"] }
serde_json = { workspace = true }
