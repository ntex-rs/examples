[workspace]
resolver = "3"
members = [
   "basics",
   "error",
   "db/async-db",
   "db/async-pg",
   "db/graphql",
   "db/diesel",
   "db/r2d2",
   "db/juniper",
   "extractors/form",
   "extractors/json",
   "extractors/multipart",
   "extras/async-ex1",
   "extras/async-ex2",
   "extras/cookie-auth",
   "extras/cookie-session",
   "extras/http-client",
   "extras/http-proxy",
   "extras/json-error",
   "extras/jsonrpc",
   "extras/server-sent-events",
   "extras/simple-auth-server",
   "extras/todo",
   "middleware",
   "state1",
   "state5",
   "state/web-state",
   "server/docker",
   "server/run-in-thread",
   "server/tokio",
   "server/shutdown",
   "server/unix-socket",
   "templates/askama",
   "templates/handlebars",
   "templates/tera",
   "templates/yarte",
   "tests/mockall",
   "tests/shimforge",
   "tls/openssl",
   "tls/rustls",
   "websockets/basic",
   "websockets/chat",
   "websockets/lowlevel",
   "websockets/tcp-chat",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
ntex = "4.2.0"
ntex-server = "4.2"
ntex-service = "5.2"
ntex-tls = "4.3"
ntex-util = "4.3"

ntex-mqtt = "9.2"
ntex-amqp = "6.2"

ntex-cors = "4.1.0"
ntex-files = "4.1.0"
ntex-identity = "4.1.0"
ntex-session = "4.1.0"
ntex-multipart = "4.1.0"
ntex-multipart-derive = "4.1.0"

askama = "0.16"
bitflags = "2"
byteorder = "1.4"
cookie = "0.18"
config = "0.15"
clap = "4.6"
deadpool-postgres = { version = "0.14", features = ["serde"] }
diesel = { version = "2.3", features = ["sqlite", "r2d2"] }
dotenv = "0.15"
derive_more = { version = "2.0.1", features = ["from", "display"] }
env_logger = "0.11"
futures = "0.3.34"
futures-test = "0.3.34"
handlebars = "6.4"
http = "1"
httpdate = "1.0"
httparse = "1.10"
json = "0.12"
juniper = "0.17"
language-tags = "0.3"
log = "0.4"
mime = "0.3"
mime_guess = "2.0"
mockall = "0.15"
num_cpus = "1.17"
openssl = "0.10"
percent-encoding = "2.1"
pin-project = "1.0"
regex = "1.12.3"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
r2d2_mysql = "28.0"
rand = "0.10"
rusqlite = "0.40"
serde = "1"
serde_json = "1"
serde_derive = "1"
serde_plain = "1"
shimforge = "0.1.3"
tokio-pg-mapper = "0.2"
tokio-pg-mapper-derive = "0.2"
tokio-postgres = "0.7"
twoway = "0.2"
tempfile = "3.4"
tera = "2.4"
thiserror = "2"
time = { version = "0.3.54", default-features = false, features = ["std"] }
tokio = "1"
validator = { version = "0.21", features = ["derive"] }
v_htmlescape = "0.17"
yarte = { version = "0.15", features = ["html-min"]  }
url = "2.1"
unicase = "2.6"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
panic = 'abort'
