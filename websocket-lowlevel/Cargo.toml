[package]
name = "websocket-lowlevel"
version = "4.0.0"
authors = ["Nikolay Kim <fafhrd91@gmail.com>"]
edition = "2024"

[[bin]]
name = "websocket-lowlevel-server"
path = "src/main.rs"

[[bin]]
name = "websocket-lowlevel-client"
path = "src/client.rs"

[dependencies]
ntex = { workspace = true, features = ["tokio", "openssl"] }
ntex-files = { workspace = true }
env_logger = { workspace = true }
futures = { workspace = true }

openssl = { workspace = true }
ntex-tls = { workspace = true, features = ["openssl"] }
